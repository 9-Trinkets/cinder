[package]
name = "cinder-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
cinder-core = { path = "../cinder-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
